<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Yoga GraphiQL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@graphql-yoga/graphiql@4.4.4/dist/graphiql.css"/>
  <style>
    body {
      margin: 0;
    }

    #root {
      height: 100dvh;
    }
  </style>
</head>
<body id="body" class="no-focus-outline">
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@graphql-yoga/graphiql@4.4.4/dist/yoga-graphiql.umd.js"></script>
<script>
  // Monaco workers can't be loaded cross-origin directly; wrap the CDN
  // worker scripts in same-origin blob URLs. Yoga spawns them as module
  // workers, so the blob must use a module import, not importScripts.
  const workerBase = 'https://cdn.jsdelivr.net/npm/@graphql-yoga/graphiql@4.4.4/dist/monacoeditorwork/';
  const workerFiles = {
    editorWorkerService: 'editor.worker.bundle.js',
    json: 'json.worker.bundle.js',
    graphql: 'graphql.worker..bundle.js',
  };
  self.MonacoEnvironment = {
    globalAPI: false,
    getWorkerUrl: function (moduleId, label) {
      const script = 'import "' + workerBase + workerFiles[label] + '";';
      return URL.createObjectURL(new Blob([script], {type: 'application/javascript'}));
    },
  };

  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  YogaGraphiQL.renderYogaGraphiQL(document.querySelector('#root'), {
    endpoint: '/graphql',
    subscriptionsProtocol: 'WS',
    subscriptionsEndpoint: wsProtocol + '//' + window.location.host + '/graphql',
  });
</script>
</body>
</html>
